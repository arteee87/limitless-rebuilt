# Publishes a release to Modrinth once the GitHub release it points at is published.
#
# The trigger is `release`, not a tag push: the release text has already been written and proofread
# on GitHub, and the same text becomes the version changelog on Modrinth. There is one branch per
# Minecraft version, so this file has to be carried over when the mod is ported to a new version.
#
# The token lives in the MODRINTH_TOKEN secret and is passed through as the environment variable
# Minotaur reads. PAT scopes: PROJECT_READ, VERSION_READ, VERSION_CREATE, VERSION_WRITE.
#
# Do not turn the configuration cache on here: Minotaur declares itself incompatible with it.
name: Publish to Modrinth

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Checks that gradle-wrapper.jar matches the official Gradle build. The file is in the
      # repository, so without this the action would have nothing to compare against.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The version number on Modrinth is assembled from gradle.properties, so the tag has to match
      # it exactly. Otherwise a jar built from one version would be published under the number of
      # another, and the only way to notice would be to download the wrong thing.
      #
      # tools/release-matrix.py --check is not usable here: it cross-checks every tag against every
      # branch at once, while the checkout of a release event gives a detached HEAD one commit deep,
      # where it would see nothing and report "checked" anyway. Its place is locally, before the tag
      # is set.
      - name: Check the tag against gradle.properties
        run: |
          tag='${{ github.event.release.tag_name }}'
          mod=$(sed -n 's/^mod_version=//p' gradle.properties)
          mc=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          actual="${mod}+mc${mc}"

          if [ "${tag#v}" != "${actual}" ]; then
            echo "::error::tag ${tag} does not match gradle.properties (${actual})"
            exit 1
          fi

          # same contract as TAG in tools/release-matrix.py: without the prefix the release will
          # not appear in the README table
          case "${tag}" in
            v*) ;;
            *) echo "::error::tag ${tag} is not shaped v<mod>+mc<minecraft>"; exit 1 ;;
          esac

          echo "tag ${tag} matches gradle.properties (${actual})"

      - name: Build
        run: ./gradlew build

      - name: Publish to Modrinth
        run: ./gradlew modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          # a multi-line value breaks through -P because of the quotes, so it goes in through
          # ORG_GRADLE_PROJECT_* instead
          ORG_GRADLE_PROJECT_modrinthChangelog: ${{ github.event.release.body }}
          ORG_GRADLE_PROJECT_modrinthVersionType: ${{ github.event.release.prerelease && 'beta' || 'release' }}