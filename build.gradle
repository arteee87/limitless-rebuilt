plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version

base {
	archivesName = project.archives_base_name
}

loom {
	// 1.20.5+ turns the annotation processor off by default, which leaves @Mixin and @At targets in
	// the named namespace; released jars need them in intermediary.
	mixin {
		useLegacyMixinAp = true
	}
}

repositories {
	mavenCentral()
	maven {
		name = 'Modrinth'
		url = uri('https://api.modrinth.com/maven')
		content {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name = 'TerraformersMC'
		url = uri('https://maven.terraformersmc.com/releases/')
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	modImplementation "maven.modrinth:cloth-config:${project.cloth_config_version}"
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.junit.jupiter:junit-jupiter-params'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	// fabric.mod.json carries a version placeholder. Token replacement is used instead of Groovy's
	// `expand`, which would evaluate the "$ModMenu" entry point as a template and fail the build.
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: ['version': project.version])
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat 'full'
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	// the file is LICENSE.md, and a missing file here is not an error: gradle ignores it silently and
	// the jar ships without the licence text the copyleft expects
	from('LICENSE.md') {
		rename { "${it.replace('.md','')}_${project.base.archivesName.get()}" }
	}
}
