plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}+mc${project.minecraft_version}"

base {
	archivesName = project.archives_base_name
}


repositories {
	mavenCentral()
	maven {
		name = 'Modrinth'
		url = uri('https://api.modrinth.com/maven')
		content {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name = 'TerraformersMC'
		url = uri('https://maven.terraformersmc.com/releases/')
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation "maven.modrinth:cloth-config:${project.cloth_config_version}"
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.junit.jupiter:junit-jupiter-params'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	// fabric.mod.json carries a version placeholder. Token replacement is used instead of Groovy's
	// `expand`, which would evaluate the "$ModMenu" entry point as a template and fail the build.
	// the version is a GString once it is interpolated, and Ant's ReplaceTokens takes a plain
	// Map<String, String>; handing it a GString fails the copy with a ClassCastException
	inputs.property 'version', project.version.toString()
	filesMatching('fabric.mod.json') {
		filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: ['version': project.version.toString()])
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat 'full'
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	// the file is LICENSE.md, and a missing file here is not an error: gradle ignores it silently and
	// the jar ships without the licence text the copyleft expects
	from('LICENSE.md') {
		rename { "${it.replace('.md','')}_${project.base.archivesName.get()}" }
	}
}

// Modrinth publication through the official Minotaur plugin. The token does not appear here: the
// plugin reads the MODRINTH_TOKEN environment variable by default, and CI takes it from a GitHub
// Actions secret.
