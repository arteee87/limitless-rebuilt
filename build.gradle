plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.10.0'
}

version = "${project.mod_version}+mc${project.minecraft_version}"

base {
	archivesName = project.archives_base_name
}

loom {
	// 1.20.5+ turns the annotation processor off by default, which leaves @Mixin and @At targets in
	// the named namespace; released jars need them in intermediary.
	mixin {
		useLegacyMixinAp = true
	}
}

repositories {
	mavenCentral()
	maven {
		name = 'Modrinth'
		url = uri('https://api.modrinth.com/maven')
		content {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name = 'TerraformersMC'
		url = uri('https://maven.terraformersmc.com/releases/')
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	modImplementation "maven.modrinth:cloth-config:${project.cloth_config_version}"
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.junit.jupiter:junit-jupiter-params'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	// fabric.mod.json carries a version placeholder. Token replacement is used instead of Groovy's
	// `expand`, which would evaluate the "$ModMenu" entry point as a template and fail the build.
	// the version is a GString once it is interpolated, and Ant's ReplaceTokens takes a plain
	// Map<String, String>; handing it a GString fails the copy with a ClassCastException
	inputs.property 'version', project.version.toString()
	filesMatching('fabric.mod.json') {
		filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: ['version': project.version.toString()])
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat 'full'
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	// the file is LICENSE.md, and a missing file here is not an error: gradle ignores it silently and
	// the jar ships without the licence text the copyleft expects
	from('LICENSE.md') {
		rename { "${it.replace('.md','')}_${project.base.archivesName.get()}" }
	}
}

// Публикация на Modrinth официальным плагином Minotaur. Токен сюда не попадает: плагин по умолчанию
// читает переменную окружения MODRINTH_TOKEN, а CI берёт её из секрета GitHub Actions.
modrinth {
	// ровно тот же суффикс, что у jar и у тега. В CI перед сборкой выполняется
	// ./tools/release-matrix.py --check, который падает, если тег и gradle.properties разошлись:
	// иначе на Modrinth уехал бы номер из одной версии под jar, собранный из другой.
	versionNumber = "${project.mod_version}+mc${project.minecraft_version}"
	projectId = project.modrinth_project_id

	gameVersions = [project.minecraft_version]
	loaders = ['fabric']

	// CI передаёт их через ORG_GRADLE_PROJECT_*, потому что текст релиза многострочный и через -P
	// с кавычками ломается. Локально остаются значения по умолчанию.
	versionType = findProperty('modrinthVersionType') ?: 'release'
	changelog = findProperty('modrinthChangelog') ?: ''

	// только переремапленный jar: -sources.jar Modrinth не просит, и лишним он там тоже не будет.
	// archiveFile, а не сама задача: плагин ждёт Provider<RegularFile>, и передача TaskProvider
	// падает ещё на этапе чтения build.gradle.
	file = project.tasks.named('remapJar').flatMap { it.archiveFile }

	// Прогон без заливки, чтобы проверить разбор полей, не израсходовав номер версии:
	//     MODRINTH_TOKEN=... ./gradlew modrinth -PmodrinthDebug=true
	// findProperty отдаёт строку, а свойство здесь булево, поэтому разбираем явно.
	debugMode = Boolean.parseBoolean(findProperty('modrinthDebug') ?: 'false')

	// Те же зависимости, что в fabric.mod.json, чтобы страница и загрузчик модов не разошлись.
	dependencies {
		required.project 'P7dR8mSH'   // Fabric API
		required.project '9s6osm5g'   // Cloth Config
		optional.project 'mOgUt4GM'   // Mod Menu — в fabric.mod.json это recommends
	}
}
