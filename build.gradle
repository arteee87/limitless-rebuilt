plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.10.0'
}

version = "${project.mod_version}+mc${project.minecraft_version}"

base {
	archivesName = project.archives_base_name
}


repositories {
	mavenCentral()
	maven {
		name = 'Modrinth'
		url = uri('https://api.modrinth.com/maven')
		content {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name = 'TerraformersMC'
		url = uri('https://maven.terraformersmc.com/releases/')
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation "maven.modrinth:cloth-config:${project.cloth_config_version}"
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.junit.jupiter:junit-jupiter-params'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	// fabric.mod.json carries a version placeholder. Token replacement is used instead of Groovy's
	// `expand`, which would evaluate the "$ModMenu" entry point as a template and fail the build.
	// the version is a GString once it is interpolated, and Ant's ReplaceTokens takes a plain
	// Map<String, String>; handing it a GString fails the copy with a ClassCastException
	inputs.property 'version', project.version.toString()
	filesMatching('fabric.mod.json') {
		filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: ['version': project.version.toString()])
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat 'full'
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	// the file is LICENSE.md, and a missing file here is not an error: gradle ignores it silently and
	// the jar ships without the licence text the copyleft expects
	from('LICENSE.md') {
		rename { "${it.replace('.md','')}_${project.base.archivesName.get()}" }
	}
}

// Modrinth publication through the official Minotaur plugin. The token does not appear here: the
// plugin reads the MODRINTH_TOKEN environment variable by default, and CI takes it from a GitHub
// Actions secret.

// Modrinth publication through the official Minotaur plugin. The token does not appear here: the
// plugin reads the MODRINTH_TOKEN environment variable by default, and CI takes it from a GitHub
// Actions secret.
modrinth {
	// exactly the suffix the jar and the tag carry. CI checks the tag against gradle.properties in the
	// release workflow instead; tools/release-matrix.py --check belongs locally, before the tag is
	// set, because it cannot see history from a detached one-commit checkout.
	versionNumber = "${project.mod_version}+mc${project.minecraft_version}"
	projectId = project.modrinth_project_id

	gameVersions = [project.minecraft_version]
	loaders = ['fabric']

	// CI passes these through ORG_GRADLE_PROJECT_*, because the release text is multi-line and -P
	// breaks on the quotes. Locally the defaults stay.
	versionType = findProperty('modrinthVersionType') ?: 'release'
	changelog = findProperty('modrinthChangelog') ?: ''

	// only the remapped jar: Modrinth does not ask for -sources.jar, and it would be dead weight
	// there as well.
	// archiveFile rather than the task itself: the plugin wants a Provider<RegularFile>, and handing
	// it a TaskProvider fails while build.gradle is still being read.
	file = project.tasks.named('jar').flatMap { it.archiveFile }

	// A dry run that checks how the fields parse without spending a version number:
	//     MODRINTH_TOKEN=... ./gradlew modrinth -PmodrinthDebug=true
	// findProperty hands back a String while the property here is a boolean, so it is parsed by hand.
	debugMode = Boolean.parseBoolean(findProperty('modrinthDebug') ?: 'false')

	// The same set as fabric.mod.json. The versions deliberately do not match: Modrinth has no field for
	// a range, only for one exact version, and pinning would make everyone on a newer Fabric API look
	// like they have an unmet dependency. The ranges live in fabric.mod.json and Fabric enforces them.
	dependencies {
		required.project 'P7dR8mSH'   // Fabric API
		required.project '9s6osm5g'   // Cloth Config
		optional.project 'mOgUt4GM'   // Mod Menu — in fabric.mod.json this is recommends
	}
}
